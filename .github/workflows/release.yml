name: Release novram

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build Standalone Binaries (${{ matrix.goos }}-${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            binary_name: novram-windows-amd64.exe
            archive_name: novram-windows-amd64.zip
            use_zip: true
          - goos: linux
            goarch: amd64
            binary_name: novram-linux-amd64
            archive_name: novram-linux-amd64.tar.gz
            use_zip: false
          - goos: linux
            goarch: arm64
            binary_name: novram-linux-arm64
            archive_name: novram-linux-arm64.tar.gz
            use_zip: false
          - goos: darwin
            goarch: arm64
            binary_name: novram-darwin-arm64
            archive_name: novram-darwin-arm64.tar.gz
            use_zip: false
          - goos: darwin
            goarch: amd64
            binary_name: novram-darwin-amd64
            archive_name: novram-darwin-amd64.tar.gz
            use_zip: false

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true

      - name: Run Unit Tests
        run: go test -v ./...

      - name: Compile Standalone novram Binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          go build -ldflags="-s -w -X main.Version=${{ github.ref_name }}" -o dist/${{ matrix.binary_name }} ./cmd/novram

      - name: Package Archives & Checksums
        run: |
          cd dist
          if [ "${{ matrix.use_zip }}" = "true" ]; then
            zip -q -9 ${{ matrix.archive_name }} ${{ matrix.binary_name }}
          else
            tar -czf ${{ matrix.archive_name }} ${{ matrix.binary_name }}
          fi
          sha256sum ${{ matrix.archive_name }} > ${{ matrix.archive_name }}.sha256
          cd ..

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive_name }}
          path: |
            dist/${{ matrix.archive_name }}
            dist/${{ matrix.archive_name }}.sha256

  publish-github-release:
    name: Publish GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate Consolidated Checksums
        run: |
          cd release-assets
          sha256sum novram-*.zip novram-*.tar.gz > checksums.txt
          cat checksums.txt
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
